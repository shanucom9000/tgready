<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Video Player</title>

  <!-- HLS support (for .m3u8 links) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }

    #container {
      width: 100%;
      max-width: 800px;
      text-align: center;
      padding: 20px;
    }

    #title {
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 600;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      aspect-ratio: 16 / 9;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .custom-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
      padding: 30px 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .video-wrapper:hover .custom-controls {
      opacity: 1;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      transition: all 0.2s ease;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(1.1);
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
    }

    .progress-bar {
      height: 100%;
      background: #3b82f6;
      width: 0%;
    }

    .timestamp {
      position: absolute;
      left: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="container">
    <div id="title">Video Player</div>

    <div class="video-wrapper">
      <video id="video"></video>

      <div class="custom-controls">
        <!-- Progress Bar -->
        <div class="progress-container" id="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- Timestamp -->
        <div class="timestamp" id="timestamp">00:00 / 00:00</div>

        <!-- Action Buttons -->
        <button class="control-btn" id="btn-backward" title="Backward 10s"><i class="fas fa-undo"></i></button>
        <button class="control-btn" id="btn-play-pause" title="Play/Pause"><i class="fas fa-play"></i></button>
        <button class="control-btn" id="btn-forward" title="Forward 10s"><i class="fas fa-redo"></i></button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const streamUrl = params.get("url");
    const titleParam = params.get("title");

    const video = document.getElementById("video");
    const titleDiv = document.getElementById("title");
    const btnPlayPause = document.getElementById("btn-play-pause");
    const btnBackward = document.getElementById("btn-backward");
    const btnForward = document.getElementById("btn-forward");
    const progressBar = document.getElementById("progress-bar");
    const progressContainer = document.getElementById("progress-container");
    const timestamp = document.getElementById("timestamp");

    // Set page title if provided in URL parameters
    if (titleParam) {
      titleDiv.innerText = titleParam;
    }

    // Load Stream URL
    if (streamUrl) {
      if (streamUrl.includes(".m3u8") && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
      } else {
        video.src = streamUrl;
      }
    } else {
      titleDiv.innerText = "No video URL provided";
    }

    // Helper to format time strings
    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Play & Pause
    function togglePlay() {
      if (video.paused) {
        video.play().catch(e => console.log("Playback error:", e));
      } else {
        video.pause();
      }
    }

    btnPlayPause.addEventListener("click", togglePlay);
    video.addEventListener("click", togglePlay);

    video.addEventListener("play", () => btnPlayPause.innerHTML = '<i class="fas fa-pause"></i>');
    video.addEventListener("pause", () => btnPlayPause.innerHTML = '<i class="fas fa-play"></i>');

    // Backward 10 seconds
    btnBackward.addEventListener("click", () => {
      video.currentTime = Math.max(0, video.currentTime - 10);
    });

    // Forward 10 seconds
    btnForward.addEventListener("click", () => {
      video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
    });

    // Update Progress Bar & Timestamp
    video.addEventListener("timeupdate", () => {
      if (video.duration) {
        const progress = (video.currentTime / video.duration) * 100;
        progressBar.style.width = `${progress}%`;
        timestamp.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
      }
    });

    video.addEventListener("loadedmetadata", () => {
      timestamp.innerText = `00:00 / ${formatTime(video.duration)}`;
    });

    // Seek Click Handler
    progressContainer.addEventListener("click", (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / progressContainer.offsetWidth;
      video.currentTime = pos * video.duration;
    });

    // Try Autoplay
    video.play().catch(e => console.log("Autoplay blocked initially:", e));
  </script>

</body>

</html>
