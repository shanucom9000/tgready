<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<!-- HLS support -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
  margin: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
}
#container {
  width: 100%;
  max-width: 900px;
  text-align: center;
}
video {
  width: 100%;
  max-height: 90vh;
  background: black;
}
#title {
  margin-bottom: 10px;
  font-size: 18px;
}
#timer, #status {
  margin-top: 10px;
}
</style>
</head>
<body>

<div id="container">
  <div id="title">Loading...</div>

  <!-- Telegram Player -->
  <video id="video" controls autoplay style="display:none;"></video>

  <!-- YouTube Player -->
  <div id="player" style="display:none;"></div>

  <h3 id="timer"></h3>
  <p id="status"></p>
</div>

<!-- YouTube API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
const params = new URLSearchParams(window.location.search);

// Parameters
const streamUrl = params.get("url");
const title = params.get("title") || "Telegram Web Player";
const uid = params.get("uid");

// Elements
const video = document.getElementById("video");
const titleDiv = document.getElementById("title");
const timerText = document.getElementById("timer");
const statusText = document.getElementById("status");

// =============================
// 🎬 TELEGRAM VIDEO MODE
// =============================
if (streamUrl) {
  titleDiv.innerText = title;
  video.style.display = "block";
  timerText.style.display = "none";
  statusText.style.display = "none";

  if (streamUrl.includes(".m3u8") && Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
  } else {
    video.src = streamUrl;
  }
}

// =============================
// 💰 WATCH & EARN MODE
// =============================
else if (uid) {
  titleDiv.innerText = "🎥 Watch & Earn";
  document.getElementById("player").style.display = "block";

  timerText.innerText = "⏳ Waiting for video...";
  statusText.innerText = "Press play to start";

  const API = "https://server-verify-lmjr.onrender.com/verify";

  // 🎥 Video list
  const videos = [
    "N0W_6SqVtfc",
    "DRRtosYMA3A",
    "rXptSZzmQIc"
  ];

  // 🎲 Prevent same video repeat
  let lastVideo = sessionStorage.getItem("lastVideo");
  let randomVideo;
  do {
    randomVideo = videos[Math.floor(Math.random() * videos.length)];
  } while (randomVideo === lastVideo);

  sessionStorage.setItem("lastVideo", randomVideo);

  let player;
  let seconds = 0;
  let timer = null;
  let rewarded = false;

  // YouTube ready
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      height: '220',
      width: '100%',
      videoId: randomVideo,
      playerVars: { autoplay: 0, controls: 1 },
      events: { onStateChange: onPlayerStateChange }
    });
  };

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING && !rewarded && seconds < 30) {
      startTimer();
    }
    if (event.data === YT.PlayerState.PAUSED) stopTimer();
    if (event.data === YT.PlayerState.ENDED) stopTimer();
  }

  function startTimer() {
    if (timer) return;

    timer = setInterval(async () => {
      seconds++;

      // 🔒 Anti skip protection
      const currentTime = player.getCurrentTime();
      if (currentTime < seconds - 2) {
        seconds = Math.floor(currentTime);
      }

      timerText.innerText = "⏳ " + seconds + " / 30 seconds";

      if (seconds >= 30 && !rewarded) {
        rewarded = true;
        clearInterval(timer);

        statusText.innerText = "Adding points...";
        console.log("Reward UID:", uid);

        try {
          const res = await fetch(API, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ uid: String(uid) })
          });

          const data = await res.json();
          console.log("API response:", data);

          statusText.innerText = "✅ Points added!";
        } catch (err) {
          console.error("API error:", err);
          statusText.innerText = "❌ Failed to add points";
        }
      }
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timer);
    timer = null;
    statusText.innerText = "Paused";
  }
}

// =============================
// ❌ INVALID LINK
// =============================
else {
  titleDiv.innerText = "❌ Invalid link";
}
</script>

</body>
</html>
