<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Video Player</title>

  <!-- Google Fonts - Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- HLS support (for .m3u8 links) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #8b5cf6;
      --primary-hover: #a78bfa;
      --bg-dark: #090d16;
      --card-bg: rgba(17, 24, 39, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --glow-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #15102a 0%, var(--bg-dark) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
      padding: 20px;
    }

    #container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    #title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
      background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(167, 139, 250, 0.2);
      letter-spacing: -0.5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      padding: 5px;
      line-height: 1.3;
    }

    /* Player Wrapper wraps Video and Custom Controls */
    #player-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Video wrapper */
    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
    }

    /* Premium centered Play Overlay */
    .play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
      opacity: 1;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .play-overlay:hover {
      background: rgba(139, 92, 246, 0.3);
      border-color: rgba(139, 92, 246, 0.5);
      transform: translate(-50%, -50%) scale(1.1);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
    }

    .video-container.playing .play-overlay {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.8);
      pointer-events: none;
    }

    /* Double Tap Seek Indicators */
    .seek-indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 30%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 5;
    }

    .seek-indicator i {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .seek-indicator span {
      font-size: 13px;
      font-weight: 600;
    }

    .seek-indicator.left {
      left: 0;
      border-top-left-radius: 20px;
      border-bottom-left-radius: 20px;
    }

    .seek-indicator.right {
      right: 0;
      border-top-right-radius: 20px;
      border-bottom-right-radius: 20px;
    }

    .seek-indicator.show {
      animation: flashSeek 0.6s ease-in-out;
    }

    @keyframes flashSeek {
      0% { opacity: 0; }
      30% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Error Overlay styling */
    .error-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 15, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      color: #ef4444;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
      text-align: center;
    }

    .error-overlay i {
      font-size: 40px;
      filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.4));
    }

    .error-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .error-message {
      font-size: 16px;
      font-weight: 500;
      color: #f3f4f6;
      max-width: 80%;
      line-height: 1.4;
    }

    /* Controls box positioned completely below the video */
    .custom-controls {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 20px 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: opacity 0.3s ease;
    }

    /* Progress bar layout */
    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .progress-container {
      flex-grow: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      cursor: pointer;
      position: relative;
      transition: height 0.2s ease;
    }

    .progress-container:hover {
      height: 10px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, var(--primary));
      width: 0%;
      border-radius: 100px;
      position: relative;
      transition: width 0.05s linear;
    }

    /* Handle on progress bar */
    .progress-bar::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px var(--primary);
      transition: transform 0.2s ease;
    }

    .progress-container:hover .progress-bar::after {
      transform: translateY(-50%) scale(1);
    }

    /* Time display text */
    .timestamp {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      min-width: 80px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Buttons layout row */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      position: relative;
    }

    /* Left actions, Center playback, Right screen toggles */
    .control-group-left,
    .control-group-center,
    .control-group-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .control-group-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .control-btn:hover {
      background: rgba(139, 92, 246, 0.15);
      border-color: rgba(139, 92, 246, 0.4);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
    }

    /* Play button styling - slightly larger */
    .control-btn.play-btn {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
      border: none;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
      font-size: 18px;
    }

    .control-btn.play-btn:hover {
      background: linear-gradient(135deg, var(--primary-hover) 0%, #4f46e5 100%);
      transform: translateY(-2px) scale(1.05);
      box-shadow: var(--glow-shadow);
    }

    /* Download button */
    .control-btn.accent-btn {
      border-radius: 12px;
      padding: 0 16px;
      width: auto;
      font-size: 14px;
      font-weight: 600;
      gap: 8px;
    }

    .control-btn.accent-btn i {
      font-size: 15px;
    }

    /* Volume controls */
    .volume-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .volume-slider-container {
      width: 0;
      overflow: hidden;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
    }

    @media (hover: hover) {
      .volume-group:hover .volume-slider-container {
        width: 80px;
        margin-left: 4px;
      }
    }

    .volume-slider-container.show-volume {
      width: 80px;
      margin-left: 4px;
    }

    #volume-slider {
      width: 80px;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 5px var(--primary);
    }

    /* Responsive adjustments for phones (Android / iOS) */
    @media (max-width: 640px) {
      body {
        padding: 10px;
      }

      #title {
        font-size: 18px;
        margin-bottom: 12px;
      }

      .custom-controls {
        padding: 15px;
        gap: 15px;
      }

      .control-btn {
        width: 40px;
        height: 40px;
        font-size: 15px;
      }

      .control-btn.play-btn {
        width: 46px;
        height: 46px;
        font-size: 16px;
      }

      .control-btn.accent-btn {
        padding: 0 12px;
        font-size: 13px;
        border-radius: 10px;
      }

      .control-btn.accent-btn span {
        display: none; /* Hide button text on mobile to save space */
      }
    }

    /* Prevent overlap on very narrow Android screens */
    @media (max-width: 480px) {
      .control-group-center {
        position: static;
        transform: none;
      }

      .controls-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
    }

    /* Fullscreen layout styling */
    #player-wrapper.fullscreen-active {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      border: none;
    }

    #player-wrapper.fullscreen-active .video-container {
      flex-grow: 1;
      height: 0; /* Let flex-grow handle size */
      aspect-ratio: auto;
    }

    #player-wrapper.fullscreen-active .custom-controls {
      border-radius: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(10, 10, 12, 0.95);
    }
  </style>
</head>

<body>

  <div id="container">
    <div id="title">Premium Video Player</div>

    <!-- Outer Player Box -->
    <div id="player-wrapper">
      <!-- Video Frame -->
      <div class="video-container">
        <!-- Error overlay -->
        <div class="error-overlay" id="error-overlay">
          <i class="fas fa-exclamation-triangle"></i>
          <div class="error-message" id="error-message">Error loading video</div>
        </div>

        <!-- Center Play Button Overlay -->
        <div class="play-overlay" id="play-overlay">
          <i class="fas fa-play"></i>
        </div>

        <!-- Double Tap Seek Indicators -->
        <div class="seek-indicator left" id="seek-left">
          <i class="fas fa-backward"></i>
          <span>10s</span>
        </div>
        <div class="seek-indicator right" id="seek-right">
          <i class="fas fa-forward"></i>
          <span>10s</span>
        </div>

        <video id="video" playsinline></video>
      </div>

      <!-- Control Bar (Directly below the Video) -->
      <div class="custom-controls">
        <!-- Progress & Time -->
        <div class="progress-wrapper">
          <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <div class="timestamp" id="timestamp">00:00 / 00:00</div>
        </div>

        <!-- Buttons Row -->
        <div class="controls-row">
          <!-- Left Actions -->
          <div class="control-group-left">
            <button class="control-btn accent-btn" id="btn-download" title="Download Source">
              <i class="fas fa-download"></i>
              <span>Download</span>
            </button>
            <div class="volume-group">
              <button class="control-btn" id="btn-volume" title="Mute / Unmute">
                <i class="fas fa-volume-up"></i>
              </button>
              <div class="volume-slider-container">
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
              </div>
            </div>
          </div>

          <!-- Centered Playback controls -->
          <div class="control-group-center">
            <button class="control-btn" id="btn-backward" title="Backward 10s">
              <i class="fas fa-backward"></i>
            </button>
            <button class="control-btn play-btn" id="btn-play-pause" title="Play / Pause">
              <i class="fas fa-play"></i>
            </button>
            <button class="control-btn" id="btn-forward" title="Forward 10s">
              <i class="fas fa-forward"></i>
            </button>
          </div>

          <!-- Right Toggles -->
          <div class="control-group-right">
            <button class="control-btn" id="btn-fullscreen" title="Toggle Fullscreen">
              <i class="fas fa-expand"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Parse params - robust extraction that parses the entire rest of the URL for 'url='
    function getQueryParam(name) {
      const href = window.location.href;
      if (name === 'url') {
        const urlIndex = href.indexOf('url=');
        if (urlIndex === -1) return null;
        let sub = href.substring(urlIndex + 4);
        
        // Exclude title param if appended after url parameter
        const titleIndex = sub.lastIndexOf('&title=');
        if (titleIndex !== -1) {
          sub = sub.substring(0, titleIndex);
        }
        try {
          return decodeURIComponent(sub);
        } catch(e) {
          return sub;
        }
      }
      
      const match = href.match(new RegExp('[?&]' + name + '=([^&#]*)'));
      if (!match) return null;
      try {
        return decodeURIComponent(match[1]);
      } catch(e) {
        return match[1];
      }
    }

    const streamUrl = getQueryParam("url");
    const titleParam = getQueryParam("title");

    const video = document.getElementById("video");
    const videoContainer = document.querySelector(".video-container");
    const titleDiv = document.getElementById("title");
    const playerWrapper = document.getElementById("player-wrapper");

    // Controls
    const btnPlayPause = document.getElementById("btn-play-pause");
    const btnBackward = document.getElementById("btn-backward");
    const btnForward = document.getElementById("btn-forward");
    const btnDownload = document.getElementById("btn-download");
    const btnFullscreen = document.getElementById("btn-fullscreen");
    const playOverlay = document.getElementById("play-overlay");
    const errorOverlay = document.getElementById("error-overlay");
    const errorMessage = document.getElementById("error-message");

    // Volume
    const btnVolume = document.getElementById("btn-volume");
    const volumeSlider = document.getElementById("volume-slider");
    const volumeIcon = btnVolume.querySelector("i");

    // Scrubber
    const progressBar = document.getElementById("progress-bar");
    const progressContainer = document.getElementById("progress-container");
    const timestamp = document.getElementById("timestamp");

    // Set page title
    if (titleParam) {
      titleDiv.innerText = titleParam;
      document.title = titleParam + " - Stream";
    }

    // Load video stream (Robust HLS loader with Native & Hls.js fallback + error recovery)
    if (streamUrl) {
      const isHls = streamUrl.toLowerCase().includes("m3u8");
      if (isHls && Hls.isSupported()) {
        const hls = new Hls({
          maxMaxBufferLength: 30,
          enableWorker: true,
          lowLatencyMode: true
        });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                console.warn("HLS Network Error, recovering...", data);
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                console.warn("HLS Media Error, recovering...", data);
                hls.recoverMediaError();
                break;
              default:
                console.error("Fatal HLS Error, falling back to direct src...", data);
                video.src = streamUrl;
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Native HLS support (Safari / iOS)
        video.src = streamUrl;
      } else {
        // Direct MP4 / general video formats
        video.src = streamUrl;
      }
    } else {
      titleDiv.innerText = "No video stream URL provided";
    }

    // Format time helper
    function formatTime(seconds) {
      if (isNaN(seconds) || seconds === Infinity) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Playback Toggle
    function togglePlay() {
      if (video.paused) {
        video.play().catch(e => console.log("Playback interrupted:", e));
      } else {
        video.pause();
      }
    }

    // Update play state classes and icons
    function updatePlayState() {
      if (video.paused) {
        btnPlayPause.innerHTML = '<i class="fas fa-play"></i>';
        videoContainer.classList.remove("playing");
      } else {
        btnPlayPause.innerHTML = '<i class="fas fa-pause"></i>';
        videoContainer.classList.add("playing");
      }
    }

    btnPlayPause.addEventListener("click", togglePlay);
    playOverlay.addEventListener("click", togglePlay);
    
    video.addEventListener("play", updatePlayState);
    video.addEventListener("pause", updatePlayState);

    // Seek controls (10 seconds)
    btnBackward.addEventListener("click", () => {
      video.currentTime = Math.max(0, video.currentTime - 10);
    });

    btnForward.addEventListener("click", () => {
      video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
    });

    // Double Tap Seek on video element (left/right side)
    let lastTap = 0;
    const seekLeft = document.getElementById("seek-left");
    const seekRight = document.getElementById("seek-right");

    function showSeekIndicator(direction) {
      const indicator = direction === "backward" ? seekLeft : seekRight;
      indicator.classList.remove("show");
      void indicator.offsetWidth; // Force reflow
      indicator.classList.add("show");
    }

    video.addEventListener("click", (e) => {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      if (tapLength < 300 && tapLength > 0) {
        // Double tap detected
        const rect = video.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const width = rect.width;
        if (clickX < width * 0.4) {
          // Double tapped left side (40% width boundary)
          video.currentTime = Math.max(0, video.currentTime - 10);
          showSeekIndicator("backward");
        } else if (clickX > width * 0.6) {
          // Double tapped right side (60% width boundary)
          video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
          showSeekIndicator("forward");
        } else {
          // Center tap: toggle play
          togglePlay();
        }
        e.preventDefault();
      } else {
        // Single tap: trigger toggle play/pause after delay
        setTimeout(() => {
          const doubleTapped = (new Date().getTime() - lastTap) < 300;
          if (!doubleTapped) {
            togglePlay();
          }
        }, 200);
      }
      lastTap = currentTime;
    });

    // Fullscreen toggling logic
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (playerWrapper.requestFullscreen) {
          playerWrapper.requestFullscreen();
        } else if (playerWrapper.webkitRequestFullscreen) {
          playerWrapper.webkitRequestFullscreen();
        } else if (playerWrapper.msRequestFullscreen) {
          playerWrapper.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    }

    btnFullscreen.addEventListener("click", toggleFullscreen);

    document.addEventListener("fullscreenchange", handleFullscreenChange);
    document.addEventListener("webkitfullscreenchange", handleFullscreenChange);

    function handleFullscreenChange() {
      const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement;
      if (isFullScreen) {
        btnFullscreen.innerHTML = '<i class="fas fa-compress"></i>';
        playerWrapper.classList.add("fullscreen-active");
      } else {
        btnFullscreen.innerHTML = '<i class="fas fa-expand"></i>';
        playerWrapper.classList.remove("fullscreen-active");
      }
    }

    // Auto-hide controls and cursor on inactivity during fullscreen
    let inactivityTimeout;
    function resetInactivityTimeout() {
      if (!document.fullscreenElement) {
        showControls();
        return;
      }
      showControls();
      clearTimeout(inactivityTimeout);
      inactivityTimeout = setTimeout(hideControls, 3000);
    }

    function hideControls() {
      if (document.fullscreenElement) {
        playerWrapper.style.cursor = 'none';
        const controls = document.querySelector(".custom-controls");
        controls.style.opacity = '0';
        controls.style.pointerEvents = 'none';
      }
    }

    function showControls() {
      playerWrapper.style.cursor = 'default';
      const controls = document.querySelector(".custom-controls");
      controls.style.opacity = '1';
      controls.style.pointerEvents = 'auto';
    }

    playerWrapper.addEventListener("mousemove", resetInactivityTimeout);
    playerWrapper.addEventListener("click", resetInactivityTimeout);
    playerWrapper.addEventListener("touchstart", resetInactivityTimeout);

    // Scrubber progress updates
    video.addEventListener("timeupdate", () => {
      if (video.duration && !isDragging) {
        const percent = (video.currentTime / video.duration) * 100;
        progressBar.style.width = `${percent}%`;
        timestamp.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
      }
    });

    video.addEventListener("loadedmetadata", () => {
      timestamp.innerText = `00:00 / ${formatTime(video.duration)}`;
    });

    // Scrubber drag seek logic
    let isDragging = false;
    
    function scrub(e) {
      const rect = progressContainer.getBoundingClientRect();
      let pos = (e.clientX - rect.left) / rect.width;
      pos = Math.max(0, Math.min(1, pos));
      progressBar.style.width = `${pos * 100}%`;
      if (!isDragging) {
        video.currentTime = pos * (video.duration || 0);
      }
      return pos;
    }

    progressContainer.addEventListener("mousedown", (e) => {
      isDragging = true;
      scrub(e);
    });

    document.addEventListener("mousemove", (e) => {
      if (isDragging) {
        scrub(e);
      }
    });

    document.addEventListener("mouseup", (e) => {
      if (isDragging) {
        const pos = scrub(e);
        video.currentTime = pos * (video.duration || 0);
        isDragging = false;
      }
    });

    // Touch support for progress bar scrubbing
    progressContainer.addEventListener("touchstart", (e) => {
      isDragging = true;
      scrub(e.touches[0]);
    });

    document.addEventListener("touchmove", (e) => {
      if (isDragging) {
        scrub(e.touches[0]);
      }
    });

    document.addEventListener("touchend", (e) => {
      if (isDragging) {
        isDragging = false;
      }
    });

    // Volume Adjustment & Icon Updates
    let lastVolume = 1.0;
    let volumeTimeout;

    function updateVolumeIcon(vol, isMuted) {
      volumeIcon.className = "";
      if (isMuted || vol === 0) {
        volumeIcon.classList.add("fas", "fa-volume-mute");
      } else if (vol < 0.5) {
        volumeIcon.classList.add("fas", "fa-volume-down");
      } else {
        volumeIcon.classList.add("fas", "fa-volume-up");
      }
    }

    btnVolume.addEventListener("click", (e) => {
      // On mobile viewports, show volume slider container first on click
      const isMobile = window.matchMedia("(max-width: 768px)").matches;
      if (isMobile) {
        const sliderContainer = document.querySelector(".volume-slider-container");
        if (!sliderContainer.classList.contains("show-volume")) {
          e.preventDefault();
          sliderContainer.classList.add("show-volume");
          clearTimeout(volumeTimeout);
          volumeTimeout = setTimeout(() => {
            sliderContainer.classList.remove("show-volume");
          }, 4000);
          return;
        }
      }

      if (video.muted) {
        video.muted = false;
        video.volume = lastVolume;
        volumeSlider.value = lastVolume;
        updateVolumeIcon(lastVolume, false);
      } else {
        lastVolume = video.volume;
        video.muted = true;
        video.volume = 0;
        volumeSlider.value = 0;
        updateVolumeIcon(0, true);
      }
    });

    volumeSlider.addEventListener("input", (e) => {
      const vol = parseFloat(e.target.value);
      video.volume = vol;
      if (vol === 0) {
        video.muted = true;
        updateVolumeIcon(0, true);
      } else {
        video.muted = false;
        lastVolume = vol;
        updateVolumeIcon(vol, false);
      }

      // Keep it visible on mobile while sliding
      const isMobile = window.matchMedia("(max-width: 768px)").matches;
      if (isMobile) {
        const sliderContainer = document.querySelector(".volume-slider-container");
        clearTimeout(volumeTimeout);
        volumeTimeout = setTimeout(() => {
          sliderContainer.classList.remove("show-volume");
        }, 4000);
      }
    });

    // Download button action
    btnDownload.addEventListener("click", () => {
      if (streamUrl) {
        const a = document.createElement("a");
        a.href = streamUrl;
        a.download = titleParam ? `${titleParam}.mp4` : "video.mp4";
        a.target = "_blank";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } else {
        alert("No video source loaded.");
      }
    });

    // Desktop Hotkeys / Keyboard Shortcuts
    document.addEventListener("keydown", (e) => {
      if (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA") {
        return;
      }
      
      switch (e.key.toLowerCase()) {
        case " ":
          e.preventDefault();
          togglePlay();
          break;
        case "arrowleft":
          e.preventDefault();
          video.currentTime = Math.max(0, video.currentTime - 10);
          showSeekIndicator("backward");
          break;
        case "arrowright":
          e.preventDefault();
          video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
          showSeekIndicator("forward");
          break;
        case "arrowup":
          e.preventDefault();
          video.volume = Math.min(1.0, video.volume + 0.05);
          volumeSlider.value = video.volume;
          video.muted = false;
          updateVolumeIcon(video.volume, false);
          break;
        case "arrowdown":
          e.preventDefault();
          video.volume = Math.max(0.0, video.volume - 0.05);
          volumeSlider.value = video.volume;
          if (video.volume === 0) {
            video.muted = true;
            updateVolumeIcon(0, true);
          } else {
            video.muted = false;
            updateVolumeIcon(video.volume, false);
          }
          break;
        case "f":
          e.preventDefault();
          toggleFullscreen();
          break;
        case "m":
          e.preventDefault();
          btnVolume.click();
          break;
      }
    });

    // Video Error Diagnostics
    video.addEventListener("error", (e) => {
      console.error("Video element error:", video.error);
      let errMsg = "Error loading/playing video.";
      if (video.error) {
        switch (video.error.code) {
          case 1: errMsg = "Video loading was aborted."; break;
          case 2: errMsg = "Network error. Please check your internet connection."; break;
          case 3: errMsg = "Video decoding failed. The media format or codec is not supported by your browser."; break;
          case 4: errMsg = "This video format or platform stream is not supported by your browser."; break;
        }
      }
      errorMessage.innerText = errMsg;
      errorOverlay.classList.add("show");
    });

    // Initial autoplay attempt
    video.play().catch(e => console.log("Autoplay blocked initially. Waiting for user interaction."));
  </script>

</body>

</html>
